events {
    worker_connections 1024;
}

http {
    resolver 127.0.0.11 ipv6=off;
    resolver_timeout 5s;

    # Кеш для отчётов
    proxy_cache_path /var/cache/nginx/reports
                     levels=1:2
                     keys_zone=reports_cache:100m
                     max_size=1g
                     inactive=1h
                     use_temp_path=off;

    proxy_cache_key "$scheme$request_method$host$request_uri";

    server {
        listen 80;
        server_name localhost;

        location ~ ^/reports/(.*)$ {
            set $report_path $1;
            set $minio_backend "http://minio:9000";

            proxy_pass $minio_backend/reports/$report_path;

            proxy_cache reports_cache;
            proxy_cache_valid 200 1h;
            proxy_cache_valid 403 404 1m;
            proxy_cache_use_stale error timeout updating;

            proxy_connect_timeout 5s;
            proxy_read_timeout 10s;

            add_header X-Cache-Status $upstream_cache_status;
            add_header X-Report-Path $report_path;
        }

        location /health {
            return 200 "OK\n";
            add_header Content-Type text/plain;
        }
    }
}